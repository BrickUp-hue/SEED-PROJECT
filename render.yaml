databases:
  - name: control-seed-db
    plan: free

services:
  # --- Backend: API FastAPI ---
  - type: web
    name: control-seed-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: control-seed-db
          property: connectionString

  # --- Frontend: sitio estático (React + Vite) ---
  - type: web
    name: control-seed-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      # IMPORTANTE: cambiar por la URL real del servicio de backend una vez creado
      - key: VITE_API_URL
        value: https://control-seed-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
