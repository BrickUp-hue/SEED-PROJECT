services:
  # --- Backend: API FastAPI ---
  - type: web
    name: control-seed-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # DATABASE_URL: opcional. Si no se define, usa SQLite local (se borra en cada redeploy).
      # Para persistencia real, agrega un disco persistente en Render y monta:
      # DATABASE_URL=sqlite:////var/data/control_seed.db
    disk:
      name: control-seed-data
      mountPath: /var/data
      sizeGB: 1

  # --- Frontend: sitio estático (React + Vite) ---
  - type: web
    name: control-seed-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      # IMPORTANTE: cambiar por la URL real del servicio de backend una vez creado
      - key: VITE_API_URL
        value: https://control-seed-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
